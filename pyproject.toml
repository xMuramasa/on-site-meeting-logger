[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "Local-first pipeline turning a meeting recording into a validated acta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "fastapi>=0.116,<0.117",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Heavy, platform-specific. Imported lazily so the rest of the pipeline installs anywhere.
stt = ["faster-whisper>=1.0"]

[project.scripts]
meeting = "meeting_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "meeting_pipeline/_bundled/config"
"prompts" = "meeting_pipeline/_bundled/prompts"
"templates" = "meeting_pipeline/_bundled/templates"
