# Native macOS deployment on a Mac mini M4 with 16 GB unified memory.
#
# Everything runs on one machine and shares one memory pool: MLX Whisper for transcription and
# a llama.cpp `llama-server` for reasoning. The pipeline never starts the model server; see
# docs/native-mac-mini.md. Meetings are serialized across the whole output root to avoid
# concurrent transcription jobs. A running llama-server remains resident during transcription.
#
# Usage:  uv run meeting process --audio ... --config config/mac-mini.yaml

transcription:
  provider: mlx-whisper
  model: mlx-community/whisper-large-v3-turbo
  device: auto            # mlx-whisper always uses Apple Silicon unified memory
  compute_type: float16   # maps to the upstream `fp16` decode option
  language: es
  # mlx_whisper.transcribe has no voice-activity filter. It relies on the upstream
  # no_speech_threshold / logprob_threshold / compression_ratio_threshold fallbacks, which the
  # pipeline surfaces as low-confidence and degraded ranges.
  vad_filter: false
  beam_size: 1            # greedy decoding; MLX does not implement beam search

reasoning:
  model: Qwen/Qwen3-8B-GGUF
  base_url: http://127.0.0.1:8080/v1
  # 16K keeps the KV cache small enough to share 16 GB with the rest of the machine, and the
  # input/output split below is checked before every request instead of being truncated.
  context_window: 16384
  max_output_tokens: 4096
  temperature: 0.1
  # A local 8B Q4_K_M has no throughput guarantee here; this is a generous ceiling, not a claim.
  timeout_seconds: 900.0
  chars_per_token: 3.6

chunking:
  # 6000-token chunks cannot coexist with a 4096-token answer inside a 16K window once the JSON
  # schema and the previous acta are added. 2400 leaves room for the explicitly supplied acta.
  target_tokens: 2400
  overlap_seconds: 45.0
  chars_per_token: 3.6
