services:
  model:
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - --model
      - Qwen/Qwen3-8B
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.90"
      - --enable-prefix-caching
      - --api-key
      - ${VLLM_API_KEY:?set VLLM_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
volumes:
  hf-cache:
